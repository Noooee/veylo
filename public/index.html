<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Veylo</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

  <!-- ==================================================
       認証画面
  ================================================== -->

  <div
    id="authScreen"
    class="screen"
  >

    <div class="auth-container">

      <div class="logo">
        Veylo
      </div>

      <p class="subtitle">
        みんなで話そう。
      </p>


      <!-- ==================================================
           ログイン
      ================================================== -->

      <div
        id="loginPanel"
        class="auth-panel"
      >

        <h1>
          ログイン
        </h1>


        <form id="loginForm">

          <label>
            名前
          </label>

          <input
            id="loginName"
            type="text"
            autocomplete="username"
            placeholder="名前"
            required
          >


          <label>
            パスワード
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="8文字以上"
            required
          >


          <div
            id="loginError"
            class="error"
          ></div>


          <button
            type="submit"
            class="primary-button"
          >
            ログイン
          </button>

        </form>


        <button
          id="showRegisterButton"
          class="link-button"
          type="button"
        >
          新規登録
        </button>


        <button
          id="forgotPasswordButton"
          class="link-button"
          type="button"
        >
          パスワードを忘れた
        </button>

      </div>


      <!-- ==================================================
           登録
      ================================================== -->

      <div
        id="registerPanel"
        class="auth-panel hidden"
      >

        <h1>
          新規登録
        </h1>

        <p class="small-text">
          同じメールアドレスでも最大5個までアカウントを作成できます。
        </p>


        <form id="registerForm">

          <label>
            メールアドレス
          </label>

          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            placeholder="example@example.com"
            required
          >


          <label>
            名前
          </label>

          <input
            id="registerName"
            type="text"
            autocomplete="username"
            placeholder="名前"
            required
          >


          <label>
            パスワード
          </label>

          <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="8文字以上"
            minlength="8"
            required
          >


          <div
            id="registerError"
            class="error"
          ></div>


          <button
            type="submit"
            class="primary-button"
          >
            アカウントを作成
          </button>

        </form>


        <button
          id="showLoginButton"
          class="link-button"
          type="button"
        >
          ログインに戻る
        </button>

      </div>


      <!-- ==================================================
           パスワード忘れ
      ================================================== -->

      <div
        id="forgotPanel"
        class="auth-panel hidden"
      >

        <h1>
          パスワード再設定
        </h1>


        <form id="forgotForm">

          <label>
            メールアドレス
          </label>

          <input
            id="forgotEmail"
            type="email"
            autocomplete="email"
            required
          >


          <div
            id="forgotMessage"
            class="message-info"
          ></div>


          <button
            type="submit"
            class="primary-button"
          >
            再設定メールを送る
          </button>

        </form>


        <button
          id="backToLoginButton"
          class="link-button"
          type="button"
        >
          ログインに戻る
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       アプリ画面
  ================================================== -->

  <div
    id="appScreen"
    class="screen hidden"
  >

    <header class="topbar">

      <div class="topbar-logo">
        Veylo
      </div>


      <div class="topbar-room">
        <span id="roomName">
          雑談
        </span>
      </div>


      <button
        id="settingsButton"
        class="icon-button"
        type="button"
      >
        ⚙️
      </button>

    </header>


    <div class="app-layout">


      <!-- ==================================================
           サイドバー
      ================================================== -->

      <aside class="sidebar">

        <button
          id="casualRoomButton"
          class="room-button active"
          type="button"
        >
          💬 雑談
        </button>


        <div class="sidebar-title">
          部屋
        </div>


        <button
          id="createRoomButton"
          class="side-button"
          type="button"
        >
          ＋ 部屋を作る
        </button>


        <button
          id="joinRoomButton"
          class="side-button"
          type="button"
        >
          🔑 招待コードで参加
        </button>

      </aside>


      <!-- ==================================================
           チャット
      ================================================== -->

      <main class="chat-area">

        <div
          id="inviteArea"
          class="invite-area hidden"
        >

          招待コード：

          <strong id="inviteCode">
            -
          </strong>

        </div>


        <div
          id="messages"
          class="messages"
        ></div>


        <button
          id="newMessageButton"
          class="new-message-button hidden"
          type="button"
        >
          ↓ 新しいメッセージ
        </button>


        <div class="scroll-buttons">

          <button
            id="scrollTopButton"
            type="button"
          >
            ↑
          </button>

          <button
            id="scrollBottomButton"
            type="button"
          >
            ↓
          </button>

        </div>


        <!-- 返信プレビュー -->

        <div
          id="replyPreview"
          class="reply-preview hidden"
        ></div>


        <!-- メッセージ入力 -->

        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="usernameInput"
            type="hidden"
          >

          <input
            id="messageInput"
            type="text"
            maxlength="5000"
            autocomplete="off"
            placeholder="メッセージを入力..."
          >

          <button
            type="submit"
            class="send-button"
          >
            送信
          </button>

        </form>

      </main>

    </div>

  </div>


  <!-- ==================================================
       部屋作成モーダル
  ================================================== -->

  <div
    id="createModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <h2>
        部屋を作る
      </h2>

      <input
        id="roomNameInput"
        type="text"
        maxlength="100"
        placeholder="部屋の名前"
      >

      <div class="modal-actions">

        <button
          id="cancelCreateButton"
          type="button"
          class="secondary-button"
        >
          キャンセル
        </button>

        <button
          id="confirmCreateButton"
          type="button"
          class="primary-button"
        >
          作成
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       部屋参加モーダル
  ================================================== -->

  <div
    id="joinModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <h2>
        部屋に参加
      </h2>

      <input
        id="inviteCodeInput"
        type="text"
        maxlength="20"
        placeholder="招待コード"
      >

      <div
        id="joinError"
        class="error"
      ></div>

      <div class="modal-actions">

        <button
          id="cancelJoinButton"
          type="button"
          class="secondary-button"
        >
          キャンセル
        </button>

        <button
          id="confirmJoinButton"
          type="button"
          class="primary-button"
        >
          参加
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       設定モーダル
  ================================================== -->

  <div
    id="settingsModal"
    class="modal hidden"
  >

    <div class="modal-content settings-content">

      <h2>
        設定
      </h2>


      <label>
        現在の名前
      </label>

      <input
        id="settingsUsernameInput"
        type="text"
        disabled
      >


      <label>
        言語
      </label>

      <select id="languageSelect">

        <option value="ja">
          日本語
        </option>

        <option value="en">
          English
        </option>

      </select>


      <div class="setting-row">

        <span>
          ダークモード
        </span>

        <button
          id="themeToggleButton"
          type="button"
        >
          OFF
        </button>

      </div>


      <div class="setting-row">

        <span>
          グレーモード
        </span>

        <button
          id="grayToggleButton"
          type="button"
        >
          OFF
        </button>

      </div>


      <div class="account-settings">

        <h3>
          アカウント
        </h3>

        <p class="small-text">
          同じメールアドレスのアカウントを最大5個まで作成できます。
        </p>

        <button
          id="manageAccountsButton"
          type="button"
          class="secondary-button full-button"
        >
          アカウントを管理
        </button>

      </div>


      <div class="modal-actions">

        <button
          id="closeSettingsButton"
          type="button"
          class="secondary-button"
        >
          閉じる
        </button>

        <button
          id="saveSettingsButton"
          type="button"
          class="primary-button"
        >
          保存
        </button>

      </div>


      <button
        id="logoutButton"
        type="button"
        class="logout-button"
      >
        ログアウト
      </button>

    </div>

  </div>


  <!-- ==================================================
       アカウント管理モーダル
  ================================================== -->

  <div
    id="accountsModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <h2>
        アカウント管理
      </h2>

      <p class="small-text">
        同じメールアドレスで作成したアカウントです。
      </p>


      <div
        id="accountList"
        class="account-list"
      ></div>


      <div
        id="accountManageMessage"
        class="error"
      ></div>


      <div class="modal-actions">

        <button
          id="closeAccountsButton"
          type="button"
          class="secondary-button"
        >
          閉じる
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       アカウント削除確認モーダル
  ================================================== -->

  <div
    id="deleteAccountModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <h2>
        アカウントを削除
      </h2>

      <p id="deleteAccountDescription">
        このアカウントを削除しますか？
      </p>


      <input
        id="deleteAccountEmail"
        type="hidden"
      >

      <input
        id="deleteAccountName"
        type="hidden"
      >


      <label>
        パスワード
      </label>

      <input
        id="deleteAccountPassword"
        type="password"
        autocomplete="current-password"
        placeholder="削除するアカウントのパスワード"
      >


      <div
        id="deleteAccountError"
        class="error"
      ></div>


      <div class="modal-actions">

        <button
          id="cancelDeleteAccountButton"
          type="button"
          class="secondary-button"
        >
          キャンセル
        </button>

        <button
          id="confirmDeleteAccountButton"
          type="button"
          class="danger-button"
        >
          削除する
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       Socket.IO
  ================================================== -->

  <script
    src="/socket.io/socket.io.js"
  ></script>

  <script
    src="/app.js"
  ></script>

</body>

</html>
