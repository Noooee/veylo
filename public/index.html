<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Veylo</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

  <!-- ==================================================
       認証画面
  ================================================== -->

  <div
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-box">

      <div class="auth-logo">
        Veylo
      </div>

      <p class="auth-subtitle">
        シンプルなリアルタイムチャット
      </p>


      <!-- ログイン -->

      <div
        id="loginPanel"
        class="auth-panel"
      >

        <h1>
          ログイン
        </h1>

        <form id="loginForm">

          <label>
            名前
          </label>

          <input
            id="loginName"
            type="text"
            maxlength="30"
            autocomplete="username"
            required
          >


          <label>
            パスワード
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >


          <button
            type="submit"
            class="auth-primary"
          >
            ログイン
          </button>

        </form>


        <button
          id="forgotPasswordButton"
          type="button"
          class="auth-link-button"
        >
          パスワードを忘れた
        </button>


        <button
          id="showRegisterButton"
          type="button"
          class="auth-secondary"
        >
          新規登録
        </button>


        <p
          id="loginError"
          class="auth-error"
        ></p>

      </div>


      <!-- 登録 -->

      <div
        id="registerPanel"
        class="auth-panel hidden"
      >

        <h1>
          新規登録
        </h1>

        <form id="registerForm">

          <label>
            メールアドレス
          </label>

          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            required
          >


          <label>
            名前
          </label>

          <input
            id="registerName"
            type="text"
            maxlength="30"
            autocomplete="nickname"
            required
          >

          <small>
            名前は他のユーザーと重複できません。
          </small>


          <label>
            パスワード
          </label>

          <input
            id="registerPassword"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >


          <button
            type="submit"
            class="auth-primary"
          >
            登録する
          </button>

        </form>


        <button
          id="showLoginButton"
          type="button"
          class="auth-secondary"
        >
          ログインへ戻る
        </button>


        <p
          id="registerError"
          class="auth-error"
        ></p>

      </div>


      <!-- パスワード忘れ -->

      <div
        id="forgotPanel"
        class="auth-panel hidden"
      >

        <h1>
          パスワードを忘れた
        </h1>

        <p class="auth-description">
          登録したメールアドレスを入力してください。
          パスワード再設定用のメールを送ります。
        </p>


        <form id="forgotForm">

          <label>
            メールアドレス
          </label>

          <input
            id="forgotEmail"
            type="email"
            autocomplete="email"
            required
          >


          <button
            type="submit"
            class="auth-primary"
          >
            再設定メールを送る
          </button>

        </form>


        <button
          id="backToLoginButton"
          type="button"
          class="auth-secondary"
        >
          ログインへ戻る
        </button>


        <p
          id="forgotMessage"
          class="auth-message"
        ></p>

      </div>

    </div>

  </div>


  <!-- ==================================================
       チャット
  ================================================== -->

  <div
    id="appScreen"
    class="hidden"
  >

    <header class="header">

      <div class="logo">
        Veylo
      </div>

      <div class="header-actions">

        <button
          id="casualRoomButton"
          class="header-button secondary"
          type="button"
        >
          雑談
        </button>

        <button
          id="createRoomButton"
          class="header-button"
          type="button"
        >
          部屋作成
        </button>

        <button
          id="joinRoomButton"
          class="header-button secondary"
          type="button"
        >
          参加
        </button>

        <button
          id="settingsButton"
          class="header-button secondary"
          type="button"
        >
          設定
        </button>

      </div>

    </header>


    <main class="main">

      <div class="room-header">

        <div>

          <div class="room-label">
            ROOM
          </div>

          <h1 id="roomName">
            雑談
          </h1>

        </div>


        <div
          id="inviteArea"
          class="invite-area hidden"
        >

          招待コード:

          <strong id="inviteCode"></strong>

        </div>

      </div>


      <div class="chat-container">

        <div class="chat-toolbar">

          <div class="chat-toolbar-title">
            💬 メッセージ
          </div>

          <div
            id="scrollControls"
            class="chat-toolbar-buttons"
          >

            <button
              id="scrollTopButton"
              type="button"
              class="scroll-button"
            >
              ↑ 上へ
            </button>

            <button
              id="scrollBottomButton"
              type="button"
              class="scroll-button"
            >
              ↓ 下へ
            </button>

          </div>

        </div>


        <div
          id="messages"
          class="messages"
        ></div>


        <button
          id="newMessageButton"
          type="button"
          class="new-message-button hidden"
        >
          新着メッセージあり ↓
        </button>

      </div>


      <div
        id="replyPreview"
        class="replying-to hidden"
      ></div>


      <form
        id="messageForm"
        class="message-form"
      >

        <input
          id="usernameInput"
          type="text"
          maxlength="30"
          readonly
        >

        <input
          id="messageInput"
          type="text"
          maxlength="2000"
          placeholder="メッセージを入力..."
          autocomplete="off"
          required
        >

        <button
          type="submit"
          class="send-button"
        >
          送信
        </button>

      </form>

    </main>


    <!-- ==================================================
         部屋作成
    ================================================== -->

    <div
      id="createModal"
      class="modal hidden"
    >

      <div class="modal-box">

        <h2>
          部屋を作成
        </h2>

        <input
          id="roomNameInput"
          type="text"
          maxlength="50"
          placeholder="部屋名"
        >

        <div class="modal-buttons">

          <button
            id="cancelCreateButton"
            type="button"
            class="cancel-button"
          >
            キャンセル
          </button>

          <button
            id="confirmCreateButton"
            type="button"
            class="primary-button"
          >
            作成
          </button>

        </div>

      </div>

    </div>


    <!-- ==================================================
         部屋参加
    ================================================== -->

    <div
      id="joinModal"
      class="modal hidden"
    >

      <div class="modal-box">

        <h2>
          部屋に参加
        </h2>

        <input
          id="inviteCodeInput"
          type="text"
          maxlength="20"
          placeholder="招待コード"
        >

        <p
          id="joinError"
          class="error-message"
        ></p>

        <div class="modal-buttons">

          <button
            id="cancelJoinButton"
            type="button"
            class="cancel-button"
          >
            キャンセル
          </button>

          <button
            id="confirmJoinButton"
            type="button"
            class="primary-button"
          >
            参加
          </button>

        </div>

      </div>

    </div>


    <!-- ==================================================
         設定
    ================================================== -->

    <div
      id="settingsModal"
      class="modal hidden"
    >

      <div class="modal-box settings-box">

        <h2>
          設定
        </h2>


        <div class="setting-item">

          <label>
            名前
          </label>

          <input
            id="settingsUsernameInput"
            type="text"
            maxlength="30"
          >

        </div>


        <div class="setting-row">

          <div>

            <strong>
              ダークモード
            </strong>

            <small>
              暗いテーマを使用します
            </small>

          </div>

          <button
            id="themeToggleButton"
            class="toggle-button"
            type="button"
          >
            OFF
          </button>

        </div>


        <div class="setting-row">

          <div>

            <strong>
              グレーモード
            </strong>

            <small>
              色をグレースケールにします
            </small>

          </div>

          <button
            id="grayToggleButton"
            class="toggle-button"
            type="button"
          >
            OFF
          </button>

        </div>


        <div class="setting-row">

          <div>

            <strong>
              言語
            </strong>

          </div>

          <select id="languageSelect">

            <option value="ja">
              日本語
            </option>

            <option value="en">
              English
            </option>

          </select>

        </div>


        <div class="modal-buttons">

          <button
            id="closeSettingsButton"
            type="button"
            class="cancel-button"
          >
            閉じる
          </button>

          <button
            id="saveSettingsButton"
            type="button"
            class="primary-button"
          >
            保存
          </button>

          <button
            id="logoutButton"
            type="button"
            class="delete-button"
          >
            ログアウト
          </button>

        </div>

      </div>

    </div>

  </div>


  <script src="/socket.io/socket.io.js"></script>

  <script src="/app.js"></script>

</body>

</html>
