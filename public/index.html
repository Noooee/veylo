<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Veylo</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- ==================================================
       認証画面
  ================================================== -->

  <div
    id="authScreen"
    class="screen"
  >

    <div class="auth-container">

      <div class="logo-area">
        <h1>Veylo</h1>
        <p>気軽につながるチャット</p>
      </div>


      <!-- ================================
           ログイン
      ================================= -->

      <div
        id="loginPanel"
        class="auth-panel"
      >

        <h2>ログイン</h2>

        <form id="loginForm">

          <div class="input-group">

            <label for="loginName">
              ユーザー名
            </label>

            <input
              id="loginName"
              type="text"
              autocomplete="username"
              placeholder="ユーザー名"
              required
            >

          </div>


          <div class="input-group">

            <label for="loginPassword">
              パスワード
            </label>

            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              placeholder="パスワード"
              required
            >

          </div>


          <div
            id="loginError"
            class="form-error"
          ></div>


          <button
            type="submit"
            class="primary-button"
          >
            ログイン
          </button>

        </form>


        <button
          id="forgotPasswordButton"
          type="button"
          class="text-button"
        >
          パスワードを忘れた方
        </button>


        <button
          id="showRegisterButton"
          type="button"
          class="secondary-button"
        >
          新規登録
        </button>

      </div>


      <!-- ================================
           新規登録
      ================================= -->

      <div
        id="registerPanel"
        class="auth-panel hidden"
      >

        <h2>新規登録</h2>

        <form id="registerForm">

          <div class="input-group">

            <label for="registerEmail">
              メールアドレス
            </label>

            <input
              id="registerEmail"
              type="email"
              autocomplete="email"
              placeholder="メールアドレス"
              required
            >

          </div>


          <div class="input-group">

            <label for="registerName">
              ユーザー名
            </label>

            <input
              id="registerName"
              type="text"
              autocomplete="username"
              placeholder="ユーザー名"
              required
            >

          </div>


          <div class="input-group">

            <label for="registerPassword">
              パスワード
            </label>

            <input
              id="registerPassword"
              type="password"
              autocomplete="new-password"
              placeholder="パスワード"
              required
            >

          </div>


          <div
            id="registerError"
            class="form-error"
          ></div>


          <button
            type="submit"
            class="primary-button"
          >
            登録する
          </button>

        </form>


        <button
          id="showLoginButton"
          type="button"
          class="text-button"
        >
          ログインに戻る
        </button>

      </div>


      <!-- ================================
           パスワードリセット
      ================================= -->

      <div
        id="forgotPanel"
        class="auth-panel hidden"
      >

        <h2>パスワードを忘れた方</h2>

        <form id="forgotForm">

          <div class="input-group">

            <label for="forgotEmail">
              メールアドレス
            </label>

            <input
              id="forgotEmail"
              type="email"
              autocomplete="email"
              placeholder="メールアドレス"
              required
            >

          </div>


          <div
            id="forgotMessage"
            class="form-message"
          ></div>


          <button
            type="submit"
            class="primary-button"
          >
            リセットメールを送信
          </button>

        </form>


        <button
          id="backToLoginButton"
          type="button"
          class="text-button"
        >
          ログインに戻る
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       アプリ画面
  ================================================== -->

  <div
    id="appScreen"
    class="screen hidden"
  >

    <div class="app-layout">


      <!-- ==================================================
           サイドバー
      ================================================== -->

      <aside class="sidebar">

        <!-- ================================
             ヘッダー
        ================================= -->

        <div class="sidebar-header">

          <div class="brand">
            <span class="brand-mark">V</span>

            <span class="brand-name">
              Veylo
            </span>
          </div>


          <button
            id="settingsButton"
            type="button"
            class="icon-button"
            title="設定"
          >
            ⚙
          </button>

        </div>


        <!-- ================================
             ユーザー
        ================================= -->

        <div class="user-card">

          <div class="user-avatar">
            <span>●</span>
          </div>

          <div class="user-info">

            <div class="user-label">
              ログイン中
            </div>

            <input
              id="usernameInput"
              class="username-display"
              type="text"
              readonly
            >

          </div>

        </div>


        <!-- ================================
             ルーム
        ================================= -->

        <div class="room-section">

          <div class="section-title">

            <span>
              ルーム
            </span>

          </div>


          <!-- 雑談 -->

          <button
            id="casualRoomButton"
            type="button"
            class="room-button active"
          >

            <span class="room-icon">
              💬
            </span>

            <span class="room-button-text">
              雑談
            </span>

          </button>


          <!-- 部屋作成 -->

          <button
            id="createRoomButton"
            type="button"
            class="room-action-button"
          >

            <span>
              ＋
            </span>

            <span>
              部屋を作成
            </span>

          </button>


          <!-- 部屋参加 -->

          <button
            id="joinRoomButton"
            type="button"
            class="room-action-button"
          >

            <span>
              ↪
            </span>

            <span>
              部屋に参加
            </span>

          </button>


          <!-- ================================
               ダイレクトメッセージ
          ================================= -->

          <div class="dm-section">

            <div class="dm-section-header">
              <span>ダイレクトメッセージ</span>
              <button
                id="userSearchButton"
                type="button"
                class="dm-add-button"
                title="ユーザーを検索"
              >
                ＋
              </button>
            </div>

            <div id="dmList" class="dm-list"></div>

          </div>

          <!-- ================================
               参加中の部屋
          ================================= -->

          <div class="joined-room-section">

            <div class="joined-room-title">
              参加中の部屋
            </div>


            <div
              id="joinedRooms"
              class="joined-rooms"
            >

              <!--
                JavaScriptから参加中の部屋が
                ここに追加されます。

                雑談は常に一番上に表示します。
              -->

            </div>

          </div>

        </div>


        <!-- ================================
             サイドバー下部
        ================================= -->

        <div class="sidebar-footer">

          <div class="connection-status">

            <span
              id="connectionDot"
              class="connection-dot"
            ></span>

            <span>
              Veylo
            </span>

          </div>

        </div>

      </aside>


      <!-- ==================================================
           メイン
      ================================================== -->

      <main class="chat-area">


        <!-- ================================
             チャットヘッダー
        ================================= -->

        <header class="chat-header">

          <div class="chat-room-info">

            <div
              id="roomIcon"
              class="chat-room-icon"
            >
              💬
            </div>

            <div>

              <h2 id="roomName">
                雑談
              </h2>

              <div class="room-subtitle">
                気軽に話しましょう
              </div>

            </div>

          </div>


          <div
            id="inviteArea"
            class="invite-area hidden"
          >

            <span class="invite-label">
              招待コード
            </span>

            <button
              id="inviteCode"
              type="button"
              class="invite-code"
              title="クリックしてコピー"
            >
              ------
            </button>

          </div>

        </header>


        <!-- ================================
             メッセージ
        ================================= -->

        <div
          id="messages"
          class="messages"
        ></div>


        <!-- ================================
             新着メッセージ
        ================================= -->

        <button
          id="newMessageButton"
          type="button"
          class="new-message-button hidden"
        >
          ↓ 新しいメッセージ
        </button>


        <!-- ================================
             スクロールボタン
        ================================= -->

        <div class="scroll-buttons">

          <button
            id="scrollTopButton"
            type="button"
            class="scroll-button"
            title="上へ"
          >
            ↑
          </button>

          <button
            id="scrollBottomButton"
            type="button"
            class="scroll-button"
            title="下へ"
          >
            ↓
          </button>

        </div>


        <!-- ================================
             返信プレビュー
        ================================= -->

        <div
          id="replyPreview"
          class="reply-preview hidden"
        ></div>


        <!-- ================================
             入力
        ================================= -->

        <div class="message-input-area">

          <form
            id="messageForm"
            class="message-form"
          >

            <input
              id="messageInput"
              type="text"
              autocomplete="off"
              placeholder="メッセージを入力..."
              maxlength="2000"
            >

            <button
              type="submit"
              class="send-button"
              title="送信"
            >
              ➤
            </button>

          </form>

        </div>

      </main>

    </div>

  </div>


  <!-- ==================================================
       ユーザー検索モーダル
  ================================================== -->

  <div id="userSearchModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>ユーザーを検索</h2>
        <button id="closeUserSearchButton" type="button" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="userSearchInput">ユーザー名</label>
          <input id="userSearchInput" type="text" maxlength="50" autocomplete="off" placeholder="ユーザー名を入力">
        </div>
        <div id="userSearchMessage" class="form-message"></div>
        <div id="userSearchResults" class="user-search-results"></div>
      </div>
    </div>
  </div>

  <!-- ==================================================
       部屋作成モーダル
  ================================================== -->

  <div
    id="createModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          部屋を作成
        </h2>

        <button
          id="cancelCreateButton"
          type="button"
          class="modal-close"
        >
          ×
        </button>

      </div>


      <div class="modal-body">

        <p class="modal-description">
          新しい部屋を作成して、友達と話しましょう。
        </p>


        <div class="input-group">

          <label for="roomNameInput">
            部屋の名前
          </label>

          <input
            id="roomNameInput"
            type="text"
            maxlength="50"
            autocomplete="off"
            placeholder="例：ゲーム部屋"
          >

        </div>

      </div>


      <div class="modal-footer">

        <button
          id="cancelCreateButton"
          type="button"
          class="secondary-button"
        >
          キャンセル
        </button>

        <button
          id="confirmCreateButton"
          type="button"
          class="primary-button"
        >
          作成する
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       部屋参加モーダル
  ================================================== -->

  <div
    id="joinModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          部屋に参加
        </h2>

        <button
          id="cancelJoinButton"
          type="button"
          class="modal-close"
        >
          ×
        </button>

      </div>


      <div class="modal-body">

        <p class="modal-description">
          招待コードを入力してください。
        </p>


        <div class="input-group">

          <label for="inviteCodeInput">
            招待コード
          </label>

          <input
            id="inviteCodeInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="例：ABC123"
          >

        </div>


        <div
          id="joinError"
          class="form-error"
        ></div>

      </div>


      <div class="modal-footer">

        <button
          id="cancelJoinButton"
          type="button"
          class="secondary-button"
        >
          キャンセル
        </button>

        <button
          id="confirmJoinButton"
          type="button"
          class="primary-button"
        >
          参加する
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       設定モーダル
  ================================================== -->

  <div
    id="settingsModal"
    class="modal hidden"
  >

    <div class="modal-content settings-content">

      <div class="modal-header">

        <h2>
          設定
        </h2>

        <button
          id="closeSettingsButton"
          type="button"
          class="modal-close"
        >
          ×
        </button>

      </div>


      <div class="modal-body">


        <!-- ユーザー名 -->

        <div class="settings-group">

          <label for="settingsUsernameInput">
            ユーザー名
          </label>

          <input
            id="settingsUsernameInput"
            type="text"
            readonly
          >

        </div>


        <!-- テーマ -->

        <div class="settings-group">

          <div class="setting-row">

            <div>

              <div class="setting-title">
                ダークモード
              </div>

              <div class="setting-description">
                画面を暗いテーマにします
              </div>

            </div>

            <button
              id="themeToggleButton"
              type="button"
              class="toggle-button"
            >
              OFF
            </button>

          </div>

        </div>


        <!-- グレーモード -->

        <div class="settings-group">

          <div class="setting-row">

            <div>

              <div class="setting-title">
                グレーモード
              </div>

              <div class="setting-description">
                色を落ち着いたグレー系にします
              </div>

            </div>

            <button
              id="grayToggleButton"
              type="button"
              class="toggle-button"
            >
              OFF
            </button>

          </div>

        </div>


        <!-- 言語 -->

        <div class="settings-group">

          <label for="languageSelect">
            言語
          </label>

          <select id="languageSelect">

            <option value="ja">
              日本語
            </option>

            <option value="en">
              English
            </option>

          </select>

        </div>

      </div>


      <div class="modal-footer">

        <button
          id="logoutButton"
          type="button"
          class="danger-button"
        >
          ログアウト
        </button>

        <div class="modal-footer-right">

          <button
            id="closeSettingsButton"
            type="button"
            class="secondary-button"
          >
            閉じる
          </button>

          <button
            id="saveSettingsButton"
            type="button"
            class="primary-button"
          >
            保存
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- ==================================================
       Socket.IO
  ================================================== -->

  <script src="/socket.io/socket.io.js"></script>

  <!-- ==================================================
       App.js
  ================================================== -->

  <script src="/app.js"></script>

</body>
</html>
