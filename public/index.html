<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Veylo</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>

<body>

  <!-- ==========================================
       ヘッダー
  =========================================== -->

  <header class="header">

    <div class="logo">
      Veylo
    </div>

    <div class="header-actions">

      <button
        id="createRoomButton"
        class="header-button"
      >
        ＋ 部屋を作る
      </button>

      <button
        id="joinRoomButton"
        class="header-button secondary"
      >
        🔑 参加
      </button>

      <button
        id="settingsButton"
        class="header-button settings-button"
        title="設定"
      >
        ⚙️
      </button>

    </div>

  </header>


  <!-- ==========================================
       メイン
  =========================================== -->

  <main class="main">

    <!-- ========================================
         部屋情報
    ========================================= -->

    <section class="room-header">

      <div>

        <div class="room-label">
          CHAT ROOM
        </div>

        <h1 id="roomName">
          雑談
        </h1>

      </div>

      <div
        id="inviteArea"
        class="invite-area hidden"
      >

        <span>
          招待コード
        </span>

        <strong id="inviteCode">
          -
        </strong>

      </div>

    </section>


    <!-- ========================================
         チャット
    ========================================= -->

    <section class="chat-container">

      <div
        id="messages"
        class="messages"
      ></div>

    </section>


    <!-- ========================================
         入力
    ========================================= -->

    <form
      id="messageForm"
      class="message-form"
    >

      <input
        id="usernameInput"
        type="text"
        maxlength="30"
        placeholder="名前"
        autocomplete="nickname"
      >

      <input
        id="messageInput"
        type="text"
        maxlength="500"
        placeholder="メッセージを入力..."
        autocomplete="off"
      >

      <button
        type="submit"
        class="send-button"
      >
        送信
      </button>

    </form>

  </main>


  <!-- ==========================================
       部屋作成モーダル
  =========================================== -->

  <div
    id="createModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <h2>
        新しい部屋を作る
      </h2>

      <input
        id="roomNameInput"
        type="text"
        maxlength="50"
        placeholder="部屋の名前"
      >

      <div class="modal-buttons">

        <button
          id="cancelCreateButton"
          type="button"
          class="cancel-button"
        >
          キャンセル
        </button>

        <button
          id="confirmCreateButton"
          type="button"
          class="primary-button"
        >
          作成
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       部屋参加モーダル
  =========================================== -->

  <div
    id="joinModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <h2>
        部屋に参加
      </h2>

      <input
        id="inviteCodeInput"
        type="text"
        maxlength="20"
        placeholder="招待コード"
      >

      <div class="modal-buttons">

        <button
          id="cancelJoinButton"
          type="button"
          class="cancel-button"
        >
          キャンセル
        </button>

        <button
          id="confirmJoinButton"
          type="button"
          class="primary-button"
        >
          参加
        </button>

      </div>

      <p
        id="joinError"
        class="error-message"
      ></p>

    </div>

  </div>


  <!-- ==========================================
       設定モーダル
  =========================================== -->

  <div
    id="settingsModal"
    class="modal hidden"
  >

    <div class="modal-box settings-box">

      <h2>
        ⚙️ 設定
      </h2>


      <!-- ユーザー名 -->

      <div class="setting-item">

        <label for="settingsUsernameInput">
          ユーザー名
        </label>

        <input
          id="settingsUsernameInput"
          type="text"
          maxlength="30"
          placeholder="名前を入力"
        >

      </div>


      <!-- 言語 -->

      <div class="setting-item">

        <label for="languageSelect">
          言語 / Language
        </label>

        <select
          id="languageSelect"
        >

          <option value="ja">
            日本語
          </option>

          <option value="en">
            English
          </option>

        </select>

      </div>


      <!-- ダークモード -->

      <div class="setting-row">

        <div>

          <strong>
            ダークモード
          </strong>

          <small>
            Dark Mode
          </small>

        </div>

        <button
          id="themeToggleButton"
          type="button"
          class="toggle-button"
        >
          OFF
        </button>

      </div>


      <!-- グレーモード -->

      <div class="setting-row">

        <div>

          <strong>
            グレーモード
          </strong>

          <small>
            Gray Mode
          </small>

        </div>

        <button
          id="grayToggleButton"
          type="button"
          class="toggle-button"
        >
          OFF
        </button>

      </div>


      <div class="modal-buttons">

        <button
          id="closeSettingsButton"
          type="button"
          class="cancel-button"
        >
          閉じる
        </button>

        <button
          id="saveSettingsButton"
          type="button"
          class="primary-button"
        >
          保存
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       Socket.IO
  =========================================== -->

  <script src="/socket.io/socket.io.js"></script>


  <!-- ==========================================
       Veylo JavaScript
  =========================================== -->

  <script src="/app.js"></script>

</body>

</html>
