<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Veylo</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- ==========================================
       ヘッダー
  =========================================== -->

  <header class="header">

    <div class="logo">
      Veylo
    </div>

    <div class="header-actions">

      <button
        id="createRoomButton"
        class="header-button"
      >
        ＋ 部屋を作る
      </button>

      <button
        id="joinRoomButton"
        class="header-button secondary"
      >
        🔑 参加
      </button>

      <button
        id="settingsButton"
        class="header-button settings-button"
      >
        ⚙ 設定
      </button>

    </div>

  </header>


  <!-- ==========================================
       メイン
  =========================================== -->

  <main class="main">

    <!-- ========================================
         部屋名
    ========================================= -->

    <section class="room-title">

      <div class="room-label">
        CHAT ROOM
      </div>

      <h1 id="roomName">
        雑談
      </h1>

      <div
        id="inviteArea"
        class="invite-area hidden"
      >
        招待コード

        <strong id="inviteCode">
          -
        </strong>
      </div>

    </section>


    <!-- ========================================
         チャット
    ========================================= -->

    <section class="chat-container">

      <div
        id="messages"
        class="messages"
      ></div>

    </section>


    <!-- ========================================
         入力
    ========================================= -->

    <form
      id="messageForm"
      class="message-form"
    >

      <input
        id="usernameInput"
        type="text"
        maxlength="30"
        placeholder="名前"
        autocomplete="nickname"
      >

      <input
        id="messageInput"
        type="text"
        maxlength="500"
        placeholder="メッセージを入力..."
        autocomplete="off"
      >

      <button
        type="submit"
        class="send-button"
      >
        送信
      </button>

    </form>

  </main>


  <!-- ==========================================
       部屋作成モーダル
  =========================================== -->

  <div
    id="createModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <h2>
        新しい部屋を作る
      </h2>

      <input
        id="roomNameInput"
        type="text"
        maxlength="50"
        placeholder="部屋の名前"
      >

      <div class="modal-buttons">

        <button
          id="cancelCreateButton"
          type="button"
          class="cancel-button"
        >
          キャンセル
        </button>

        <button
          id="confirmCreateButton"
          type="button"
          class="primary-button"
        >
          作成
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       部屋参加モーダル
  =========================================== -->

  <div
    id="joinModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <h2>
        部屋に参加
      </h2>

      <input
        id="inviteCodeInput"
        type="text"
        maxlength="20"
        placeholder="招待コード"
      >

      <div class="modal-buttons">

        <button
          id="cancelJoinButton"
          type="button"
          class="cancel-button"
        >
          キャンセル
        </button>

        <button
          id="confirmJoinButton"
          type="button"
          class="primary-button"
        >
          参加
        </button>

      </div>

      <p
        id="joinError"
        class="error-message"
      ></p>

    </div>

  </div>


  <!-- ==========================================
       設定モーダル
  =========================================== -->

  <div
    id="settingsModal"
    class="modal hidden"
  >

    <div class="modal-box settings-box">

      <h2>
        ⚙ 設定
      </h2>


      <!-- 表示名 -->

      <label class="settings-label">
        表示名
      </label>

      <input
        id="settingsUsernameInput"
        type="text"
        maxlength="30"
        placeholder="名前"
      >


      <!-- 言語 -->

      <div class="settings-item">

        <div>

          <div class="settings-item-title">
            言語
          </div>

          <div class="settings-item-description">
            表示する言語を選択
          </div>

        </div>

        <select
          id="languageSelect"
          class="settings-select"
        >

          <option value="ja">
            日本語
          </option>

          <option value="en">
            English
          </option>

        </select>

      </div>


      <!-- ダークモード -->

      <div class="settings-item">

        <div>

          <div class="settings-item-title">
            ダークモード
          </div>

          <div class="settings-item-description">
            暗い画面で表示
          </div>

        </div>

        <button
          id="themeToggleButton"
          type="button"
          class="toggle-button"
        >
          OFF
        </button>

      </div>


      <!-- グレーモード -->

      <div class="settings-item">

        <div>

          <div class="settings-item-title">
            グレーモード
          </div>

          <div class="settings-item-description">
            色を抑えた落ち着いた表示
          </div>

        </div>

        <button
          id="grayToggleButton"
          type="button"
          class="toggle-button"
        >
          OFF
        </button>

      </div>


      <!-- ボタン -->

      <div class="modal-buttons">

        <button
          id="closeSettingsButton"
          type="button"
          class="cancel-button"
        >
          閉じる
        </button>

        <button
          id="saveSettingsButton"
          type="button"
          class="primary-button"
        >
          保存
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       Socket.IO
  =========================================== -->

  <script src="/socket.io/socket.io.js"></script>

  <script src="/app.js"></script>

</body>

</html>
