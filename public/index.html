<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Veylo</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>


  <!-- ==================================================
       認証画面
  ================================================== -->

  <section
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-box">

      <div class="auth-logo">
        Veylo
      </div>

      <div class="auth-subtitle">
        シンプルなコミュニケーションスペース
      </div>


      <!-- ==========================
           ログイン
      =========================== -->

      <div
        id="loginPanel"
        class="auth-panel"
      >

        <h1>
          ログイン
        </h1>


        <form
          id="loginForm"
        >

          <label for="loginName">
            名前
          </label>

          <input
            id="loginName"
            type="text"
            autocomplete="username"
            required
          >


          <label for="loginPassword">
            パスワード
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >


          <button
            type="submit"
            class="auth-primary"
          >
            ログイン
          </button>

        </form>


        <div
          id="loginError"
          class="auth-error"
        ></div>


        <button
          id="showRegisterButton"
          type="button"
          class="auth-secondary"
        >
          新規登録
        </button>


        <button
          id="forgotPasswordButton"
          type="button"
          class="auth-link-button"
        >
          パスワードを忘れた場合
        </button>

      </div>


      <!-- ==========================
           登録
      =========================== -->

      <div
        id="registerPanel"
        class="auth-panel hidden"
      >

        <h1>
          新規登録
        </h1>


        <form
          id="registerForm"
        >

          <label for="registerEmail">
            メールアドレス
          </label>

          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            required
          >


          <label for="registerName">
            名前
          </label>

          <input
            id="registerName"
            type="text"
            autocomplete="username"
            maxlength="50"
            required
          >


          <label for="registerPassword">
            パスワード
          </label>

          <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <small>
            8文字以上で設定してください。
          </small>


          <button
            type="submit"
            class="auth-primary"
          >
            アカウントを作成
          </button>

        </form>


        <div
          id="registerError"
          class="auth-error"
        ></div>


        <button
          id="showLoginButton"
          type="button"
          class="auth-secondary"
        >
          ログインに戻る
        </button>

      </div>


      <!-- ==========================
           パスワード忘れ
      =========================== -->

      <div
        id="forgotPanel"
        class="auth-panel hidden"
      >

        <h1>
          パスワードを忘れた場合
        </h1>


        <p class="auth-description">
          登録しているメールアドレスを入力してください。
          パスワード再設定の案内を送信します。
        </p>


        <form
          id="forgotForm"
        >

          <label for="forgotEmail">
            メールアドレス
          </label>

          <input
            id="forgotEmail"
            type="email"
            autocomplete="email"
            required
          >


          <button
            type="submit"
            class="auth-primary"
          >
            再設定メールを送信
          </button>

        </form>


        <div
          id="forgotMessage"
          class="auth-message"
        ></div>


        <button
          id="backToLoginButton"
          type="button"
          class="auth-secondary"
        >
          ログインに戻る
        </button>

      </div>

    </div>

  </section>


  <!-- ==================================================
       アプリ
  ================================================== -->

  <section
    id="appScreen"
    class="hidden"
  >


    <!-- ==================================================
         ヘッダー
    ================================================== -->

    <header class="header">

      <div class="logo">
        Veylo
      </div>


      <div class="header-actions">

        <button
          id="casualRoomButton"
          type="button"
          class="header-button secondary"
        >
          雑談
        </button>


        <button
          id="createRoomButton"
          type="button"
          class="header-button"
        >
          ＋ 部屋作成
        </button>


        <button
          id="joinRoomButton"
          type="button"
          class="header-button"
        >
          部屋参加
        </button>


        <button
          id="settingsButton"
          type="button"
          class="header-button secondary"
        >
          設定
        </button>

      </div>

    </header>


    <!-- ==================================================
         メイン
    ================================================== -->

    <main class="main">


      <!-- ==========================
           ルームヘッダー
      =========================== -->

      <div class="room-header">

        <div>

          <div class="room-label">
            ROOM
          </div>

          <h1 id="roomName">
            雑談
          </h1>

        </div>


        <div
          id="inviteArea"
          class="invite-area hidden"
        >

          招待コード

          <strong id="inviteCode">
          </strong>

        </div>

      </div>


      <!-- ==================================================
           チャット
      ================================================== -->

      <section class="chat-container">


        <!-- ==========================
             ツールバー
        =========================== -->

        <div class="chat-toolbar">

          <div class="chat-toolbar-title">
            💬 メッセージ
          </div>


          <div class="chat-toolbar-buttons">

            <button
              id="scrollTopButton"
              type="button"
              class="scroll-button"
            >
              ↑ 上へ
            </button>


            <button
              id="scrollBottomButton"
              type="button"
              class="scroll-button"
            >
              ↓ 下へ
            </button>

          </div>

        </div>


        <!-- ==========================
             メッセージ
        =========================== -->

        <div
          id="messages"
          class="messages"
        ></div>


        <!-- ==========================
             新着
        =========================== -->

        <button
          id="newMessageButton"
          type="button"
          class="new-message-button hidden"
        >
          ↓ 新着メッセージ
        </button>

      </section>


      <!-- ==================================================
           返信プレビュー
      ================================================== -->

      <div
        id="replyPreview"
        class="replying-to hidden"
      ></div>


      <!-- ==================================================
           入力
      ================================================== -->

      <form
        id="messageForm"
        class="message-form"
      >

        <input
          id="usernameInput"
          type="text"
          readonly
          aria-label="ユーザー名"
        >


        <input
          id="messageInput"
          type="text"
          maxlength="5000"
          placeholder="メッセージを入力..."
          autocomplete="off"
        >


        <button
          type="submit"
          class="send-button"
        >
          送信
        </button>

      </form>

    </main>

  </section>


  <!-- ==================================================
       部屋作成モーダル
  ================================================== -->

  <div
    id="createModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <h2>
        部屋を作成
      </h2>


      <label>
        部屋の名前
      </label>

      <input
        id="roomNameInput"
        type="text"
        maxlength="100"
        placeholder="例：ゲーム部屋"
      >


      <div class="modal-buttons">

        <button
          id="cancelCreateButton"
          type="button"
          class="cancel-button"
        >
          キャンセル
        </button>


        <button
          id="confirmCreateButton"
          type="button"
          class="primary-button"
        >
          作成
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       部屋参加モーダル
  ================================================== -->

  <div
    id="joinModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <h2>
        部屋に参加
      </h2>


      <label>
        招待コード
      </label>

      <input
        id="inviteCodeInput"
        type="text"
        maxlength="20"
        placeholder="招待コードを入力"
      >


      <div
        id="joinError"
        class="error-message"
      ></div>


      <div class="modal-buttons">

        <button
          id="cancelJoinButton"
          type="button"
          class="cancel-button"
        >
          キャンセル
        </button>


        <button
          id="confirmJoinButton"
          type="button"
          class="primary-button"
        >
          参加
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       設定モーダル
  ================================================== -->

  <div
    id="settingsModal"
    class="modal hidden"
  >

    <div class="modal-box settings-box">

      <h2>
        設定
      </h2>


      <div class="setting-item">

        <label for="settingsUsernameInput">
          ユーザー名
        </label>

        <input
          id="settingsUsernameInput"
          type="text"
          readonly
        >

      </div>


      <div class="setting-row">

        <div>

          <strong>
            ダークモード
          </strong>

          <small>
            暗いテーマに変更します。
          </small>

        </div>


        <button
          id="themeToggleButton"
          type="button"
          class="toggle-button"
        >
          OFF
        </button>

      </div>


      <div class="setting-row">

        <div>

          <strong>
            グレーモード
          </strong>

          <small>
            画面をグレースケールにします。
          </small>

        </div>


        <button
          id="grayToggleButton"
          type="button"
          class="toggle-button"
        >
          OFF
        </button>

      </div>


      <div class="setting-item">

        <label for="languageSelect">
          言語
        </label>

        <select
          id="languageSelect"
        >

          <option value="ja">
            日本語
          </option>

          <option value="en">
            English
          </option>

        </select>

      </div>


      <div class="modal-buttons">

        <button
          id="logoutButton"
          type="button"
          class="delete-button"
        >
          ログアウト
        </button>


        <button
          id="closeSettingsButton"
          type="button"
          class="cancel-button"
        >
          閉じる
        </button>


        <button
          id="saveSettingsButton"
          type="button"
          class="primary-button"
        >
          保存
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================================
       Socket.IO
  ================================================== -->

  <script src="/socket.io/socket.io.js"></script>

  <!-- ==================================================
       Veylo App
  ================================================== -->

  <script src="/app.js"></script>

</body>

</html>
